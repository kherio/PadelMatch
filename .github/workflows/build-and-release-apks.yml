name: Build and Release APKs

on:
  push:
    branches:
      - main
    # Solo recompila y publica cuando cambia algo que afecta a la app;
    # un cambio de README u otros ficheros no genera build ni release.
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-and-release-apks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.keystore"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          echo "version_name=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE:-0}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          APK_NAME="PadelMatch-${{ steps.version.outputs.version_name }}.apk"
          mkdir -p dist
          mv app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          echo "path=dist/$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadelMatch-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: PadelMatch ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}

      - name: Remove any other asset from the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          KEEP="$(basename "${{ steps.apk.outputs.path }}")"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r NAME; do
            if [ "$NAME" != "$KEEP" ]; then
              gh release delete-asset "$TAG" "$NAME" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
