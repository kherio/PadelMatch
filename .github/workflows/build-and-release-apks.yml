name: Build and Release APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          echo "version_name=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE:-0}" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadelMatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadelMatch-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}-${{ github.run_number }}
          name: PadelMatch v${{ steps.version.outputs.version_name }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
